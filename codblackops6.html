<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <title>COD | Game Details</title>
  <link rel="stylesheet" href="style.css">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
</head>
<body>
  <section class="game-detail">
    <div class="container">
      <!-- Optional logo -->
      <!-- <img src="cod-logo.png" alt="Call of Duty Logo" style="display:block; margin: 0 auto 20px; max-width: 200px;"> -->

      <h1>Call Of Duty</h1>
      <p><strong>Mode:</strong> 4v4 TDM</p>
      <p><strong>Prize:</strong> PKR 100,000</p>

      <h2>Game Rules</h2>
      <ul>
        <li>Only mobile devices allowed.</li>
        <li>No emulators or controllers.</li>
        <li>Team must report 15 minutes before match time.</li>
        <li>Disrespectful behavior will result in disqualification.</li>
        <!-- Add more rules as needed -->
      </ul>
    </div>
  </section>
</body>
</html>
