<!-- Example: pubg.html -->
<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <title>PUBG Mobile | Game Details</title>
  <link rel="stylesheet" href="style.css">
</head>
<body>
  <section class="game-detail">
    <div class="container">
      <h1>PUBG Mobile</h1>
      <p><strong>Mode:</strong> 4v4 TDM</p>
      <p><strong>Prize:</strong> PKR 100,000</p>
      <h2>Game Rules</h2>
      <ul>
        <li>Only mobile devices allowed.</li>
        <li>No emulators or controllers.</li>
        <li>Team must report 15 minutes before match time.</li>
        <li>Disrespectful behavior will result in disqualification.</li>
        <!-- Add more rules as needed -->
      </ul>
    </div>
  </section>

  <section id="register" class="section registration">
    <div class="container">
        <h2 class="section-title">Registration</h2>
        <form id="registrationForm" class="registration-form">
            <div class="form-toggle">
                <button type="button" class="toggle-btn active" data-form="team">Team Registration</button>
                <button type="button" class="toggle-btn" data-form="solo">Solo Registration</button>
            </div>
            
            <div class="form-content active" id="teamForm">
                <input type="text" placeholder="Team Name" required>
                <input type="text" placeholder="University" required>
                <input type="email" placeholder="Team Leader Email" required>
                <div class="members">
                    <input type="text" placeholder="Member 1" required>
                    <input type="text" placeholder="Member 2">
                    <input type="text" placeholder="Member 3">
                    <input type="text" placeholder="Member 4">
                </div>
                <select required>
                    <option value="">Select Game</option>
                    <option>PUBG Mobile</option>
                    <option>Call of Duty</option>
                </select>
            </div>

            <div class="form-content" id="soloForm">
                <input type="text" placeholder="Full Name" required>
                <input type="text" placeholder="University" required>
                <input type="email" placeholder="Email" required>
                <select required>
                    <option value="">Select Game</option>
                    <option>FIFA 25</option>
                </select>
            </div>
            <button type="submit" class="cta-btn">Submit Registration</button>
        </form>
    </div>
</section>


</body>
</html>
